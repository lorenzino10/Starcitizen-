name: Sonda fonti (temporanea)
on:
  push:
    branches: [claude/destination-intel]
    paths: [web/tools/probe_destinations.mjs, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node web/tools/probe_destinations.mjs
