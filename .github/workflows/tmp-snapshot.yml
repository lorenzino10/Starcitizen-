name: tmp snapshot dati (diagnosi, da rimuovere)
on:
  push:
    branches: [tmp/snapshot-dati]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/tools/fetch_snapshot.mjs
      - run: |
          git config user.name "navcom-bot"; git config user.email "navcom-bot@users.noreply.github.com"
          git add -f web/data/positions-*.json
          git commit -m "snapshot per diagnosi"
          git push origin HEAD:tmp/snapshot-dati
